[package]
name = "rustframe"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "^0.34", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
win-icon-extractor = { version = "0.1", features = ["png"] }
tray-icon = "0.24.1"
image = "0.25.10"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

egui = "^0.34"

rand = { version = "0.8", features = ["small_rng"] }
sysinfo = { version = "^0.29" }