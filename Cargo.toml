[package]
name = "rustframe"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # <-- ADD THIS LINE
tray-icon = "0.24"
image = "0.25.10"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }